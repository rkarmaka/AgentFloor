task_id: A2
fixture: fixtures/A/A2_supplier_registry.yaml
name: Search for a record by name
level: A
category: single_tool_retrieval
subcategory: keyword_search
goal: Search for a record by name and report the matching ID.
difficulty_rationale: Single tool call — tests whether the model can pass a search query and extract the relevant result from a list.
tools_available:
  - search_records
max_steps: 2
allowed_repair_turns: 1
deterministic: true
requires_final_submission: false
initial_context:
  domain: supplier_registry
  user_intent: find_record_id
gold_state:
  query: Pinnacle Systems
  target_record_id: SUP-104
pass_conditions:
  - correct_tool_called
  - correct_query_passed
  - correct_record_id_reported
  - within_step_budget
soft_metrics:
  - num_tool_calls
  - invalid_tool_calls
  - total_latency_ms
primary_failure_labels:
  - wrong_argument
  - tool_call_syntax_error
  - wrong_record_selected
  - final_answer_incorrect
secondary_failure_labels:
  - premature_termination
  - step_budget_exceeded
variant_axes:
  - paraphrase
  - entity_alias
  - distractor_text
  - reordered_instruction
  - mild_typo

oracle_evaluator:
  final_answer_check:
    type: exact_field_match
    expected_fields:
      record_id: SUP-104
  trajectory_check:
    require_step_budget: true
    require_valid_tool_arguments: true

trace_requirements:
  must_call_tools:
    - search_records
  optional_tools: []
  forbidden_behaviors:
    - type: hallucinated_tool
    - type: terminate_without_answer

notes_for_evaluator: Search results may contain distractors. Model must pick the correct match. Only one tool call is needed.
example_prompt: Search for the supplier called Pinnacle Systems and tell me its record ID.
expected_agent_behavior:
  - call search_records with "Pinnacle Systems"
  - identify the correct match from results
  - report the record ID
