task_id: A1
fixture: fixtures/A/A1_product_catalog.yaml
name: Look up a record by ID
level: A
category: single_tool_retrieval
subcategory: direct_lookup
goal: Look up a record by its given ID and report a specific field value.
difficulty_rationale: Single tool call — tests basic tool invocation with correct argument passing and output reading.
tools_available:
  - lookup_record
max_steps: 2
allowed_repair_turns: 1
deterministic: true
requires_final_submission: false
initial_context:
  domain: product_catalog
  user_intent: check_record_field
gold_state:
  target_record_id: P104
  target_field: status
  target_value: active
pass_conditions:
  - correct_tool_called
  - correct_record_id_passed
  - correct_field_value_reported
  - within_step_budget
soft_metrics:
  - num_tool_calls
  - invalid_tool_calls
  - total_latency_ms
primary_failure_labels:
  - wrong_argument
  - tool_call_syntax_error
  - final_answer_incorrect
secondary_failure_labels:
  - premature_termination
  - step_budget_exceeded
variant_axes:
  - paraphrase
  - distractor_text
  - ID_format_noise
  - reordered_instruction
  - mild_typo

oracle_evaluator:
  final_answer_check:
    type: exact_field_match
    expected_fields:
      status: active
  trajectory_check:
    require_step_budget: true
    require_valid_tool_arguments: true

trace_requirements:
  must_call_tools:
    - lookup_record
  optional_tools: []
  forbidden_behaviors:
    - type: hallucinated_tool
    - type: terminate_without_answer

notes_for_evaluator: Model must call lookup_record with P104 and report the status field. No search step needed — ID is given directly.
example_prompt: Look up product record P104 and tell me its current status.
expected_agent_behavior:
  - call lookup_record with ID P104
  - read status field from response
  - report the value
