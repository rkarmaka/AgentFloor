# Structured-prompt ablation — plan→execute→submit scaffolding
#
# Tests whether a more directive system prompt reduces F5 (early
# resignation) in SLMs by explicitly separating the agentic loop into
# plan/execute/submit phases.
#
# Uses system_prompt_override to fully replace the default SYSTEM_PROMPT.
# Each model appears twice: once with the default prompt (baseline name),
# once with the structured prompt (name-structured suffix).
#
# 4 models x 2 prompts x 30 tasks x 3 variants x 3 runs = 2,160 runs
# (but we already have baseline data from Pass 2, so only the structured
# half needs fresh runs = 1,080 runs)
#
# Usage:
#   python runs/run_sweep.py --config sweep_configs/structured_prompt_ablation.yaml \
#     --models gemma4:26b-structured

sweep_name: structured_prompt_ablation
backend: ollama
base_url: http://localhost:11434/v1
results_dir: results
max_output_tokens: 1024
probe_before_run: false

models:
  - name: gemma4:26b-structured
    params_b: 26.0
    tier: 26b
    system_prompt_override: |
      You are a task-completion agent. Follow these three phases exactly:

      PHASE 1 — PLAN
      Read the user's request. Identify which tools you need to call and in what order. Do NOT call any tools yet.

      PHASE 2 — EXECUTE
      Call the tools one at a time using the provider's native tool-calling interface. After each tool result, decide whether you need another tool call or have enough information. Do NOT invent tools that are not in the provided list.

      PHASE 3 — SUBMIT
      When you have gathered all the information needed:
      - If the task requires a submission, call submit_decision with the correct arguments. Your task is NOT complete until submit_decision returns success.
      - If the task does not require a submission, respond with a short, direct final answer.

      Important: Do NOT stop after Phase 1. You MUST execute tool calls and reach Phase 3. Do NOT invent facts — only use information from tool results.
    api_model: gemma4:26b
    notes: "gemma4:26b with structured plan→execute→submit prompt"

