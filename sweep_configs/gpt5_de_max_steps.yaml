# gpt-5 D/E max_steps ablation — F-009 open follow-up #2
#
# Tests whether gpt-5's F4 (step_budget_exhausted) dominance on D-tier
# (24/45 failures) reflects harness clipping vs a genuine planning ceiling.
# F-009 logged the failure-mode contrast: gpt-5 D/E = F4 dominant + F7
# partial completions (model is *trying*); gemma4:26b D/E = F5+F3+F1
# (model is *resigning*). If D/E TCR climbs substantially with longer
# step budget, the floor argument should soften from "frontier+SLMs all
# fail D/E" to "D/E completion is attainable with longer planning budget".
#
# Sweep design: 10 tasks (5 D + 5 E) x 3 variants (v0,v1,v2) x 3 runs
# = 90 runs. Same task slice as the original frontier_anchor.yaml gpt-5
# sweep so cells line up directly with F-009's per-tier numbers.
#
# Cost projection (per F-009 token analysis):
#   - Original gpt-5 D: avg 5232 tokens, $1.12 across 45 calls
#   - Original gpt-5 E: avg 12034 tokens, $2.27 across 45 calls
#   - With 2x step budget: tokens may grow up to ~3-4x for completions
#     that previously F4'd, modestly less for early-resign failures
#   - Estimated total: $4-8 (was $3.39 baseline)
#
# Result path: results/openai/gpt-5-extsteps/<task>__v[0-2]__run[0-2].json
# (separate slug from the baseline gpt-5 path so we keep both for
# comparison; the api_model name stays gpt-5 so OpenAI sees the same
# request).
#
# Usage:
#   python runs/run_sweep.py --config sweep_configs/gpt5_de_max_steps.yaml
#
# Or task-by-task to surface infrastructure issues first:
#   python runs/run_sweep.py --config sweep_configs/gpt5_de_max_steps.yaml \
#     --tasks D1

sweep_name: gpt5_de_max_steps
backend: openai
results_dir: results
max_output_tokens: 4096       # bumped from 2048 — D/E reasoning needs headroom
                              # if the model actually closes the loop
probe_before_run: false
auto_pull: false
auto_stop: false

# Override the task-declared max_steps for every (task, variant, run) in
# this sweep. D tasks declare 8 steps, E tasks declare 10-12. Setting
# override=20 gives gpt-5 ~2x the budget across D/E uniformly.
max_steps_override: 20

models:
  - name: gpt-5-extsteps
    api_model: gpt-5
    backend: openai
    tier: frontier
    notes: "gpt-5 with max_steps_override=20 for the D/E F4 ablation"

tasks: [D1, D2, D3, D4, D5, E1, E2, E3, E4, E5]
variants: [v0, v1, v2]
runs_per_combo: 3
