# AgentFloor sweep — canonical Ollama model list (2026-04-14 refresh)
#
# One curated set of latest-generation Ollama models that pass the native
# tool-calling requirement (see doc/gaps.md G-014, G-017). Supersedes the
# per-tier ollama_*.yaml configs and the earlier ollama_native.yaml list.
#
# Inclusion rule: either (a) already probed native on this machine, or
# (b) listed in ollama.com/search?c=tools with a registered tool template.
# Models that previously probed as text_leaked / error are excluded
# (gemma3:*, deepseek-r1:*, phi4:14b, phi4-mini:*, granite3.2:*,
# qwen2.5-coder:*, mistral-small:22b, mixtral:*).
#
# Model count: 16 models across 7 size tiers, covering 8 vendor families
# (OpenAI, Alibaba, Google, IBM, Mistral, NVIDIA, Groq, plus HuggingFace
# legacy via smollm2 if added).
#
# Total at runs_per_combo=1, variants=[v0], tasks=all:
#   16 × 30 × 1 × 1 = 480 runs
# Scale up for the final sweep by bumping runs_per_combo → 5 and variants → 5
# (→ 12,000 runs).

sweep_name: ollama_full
backend: ollama
base_url: http://localhost:11434/v1
results_dir: results
max_output_tokens: 1024
compat_out: results/ollama_compatibility.yaml

models:
  # ── Micro (<1B) — capability floor probe ────────────────────────────────────
  - {name: functiongemma:270m, params_b: 0.27, tier: micro,
     notes: "Google fn-call specialist; expect A-tier only, not a general model"}
  - {name: qwen3:0.6b,         params_b: 0.6,  tier: micro}

  # ── Sub-3B ──────────────────────────────────────────────────────────────────
  - {name: qwen3:1.7b,         params_b: 1.7,  tier: sub3b}
  - {name: qwen3.5:2b,         params_b: 2.0,  tier: sub3b,
     notes: "Qwen3.5 multimodal, 256K ctx"}

  # ── 3B–4B ───────────────────────────────────────────────────────────────────
  - {name: granite4:3b,        params_b: 3.0,  tier: 3b4b,
     notes: "IBM dense, 128K ctx; probed native"}
  - {name: ministral-3:3b,     params_b: 3.0,  tier: 3b4b,
     notes: "Mistral edge SLM"}
  - {name: nemotron-3-nano:4b, params_b: 4.0,  tier: 3b4b,
     notes: "NVIDIA agentic-tuned"}

  # ── 7B–9B (AgentFloor primary focus zone) ───────────────────────────────────
  - {name: qwen3:8b,           params_b: 8.0,  tier: 7b9b}
  - {name: ministral-3:8b,     params_b: 8.0,  tier: 7b9b}
  - {name: gemma4:e4b,         params_b: 4.0,  tier: 7b9b,
     notes: "Gemma 4 edge variant; replaces broken gemma3 family"}

  # ── 12B–14B ─────────────────────────────────────────────────────────────────
  - {name: qwen3:14b,          params_b: 14.0, tier: 12b14b}
  - {name: ministral-3:14b,    params_b: 14.0, tier: 12b14b}

  # ── 20B–27B ─────────────────────────────────────────────────────────────────
  - {name: gpt-oss:20b,        params_b: 20.0, tier: 20b27b,
     notes: "OpenAI gpt-oss MXFP4, native fn-call + browsing + python tools"}
  - {name: mistral-small3.2:24b, params_b: 24.0, tier: 20b27b,
     notes: "Mistral Small 3.2 — improved fn-call template vs 3.0/3.1"}
  - {name: gemma4:26b,         params_b: 26.0, tier: 20b27b,
     notes: "Gemma 4 frontier-tier SLM, 256K ctx"}

  # ── 30B+ (SLM ceiling reference) ────────────────────────────────────────────
  - {name: qwen3:32b,          params_b: 32.0, tier: 30b,
     notes: "Qwen3 dense ceiling for the SLM tier"}

tasks: all
variants: [v0]
runs_per_combo: 1
